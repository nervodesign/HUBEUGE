function hhmm(ts){var d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function diaTxt(ts){var d=new Date(ts),h=new Date();var a=new Date(h);a.setDate(h.getDate()-1);if(d.toDateString()===h.toDateString())return 'Hoy';if(d.toDateString()===a.toDateString())return 'Ayer';return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});}
function chSeenDe(d,quien){var s=(d.st||{})[quien];return s&&s.seen||0;}

function vChat(d){var M=vivos(d.m).sort(function(a,b){return (a.cts||a.ts)-(b.cts||b.ts);});var b=balance(d);var dia='',h='';var otroSeen=chSeenDe(d,YO==='euge'?'gon':'euge');var byId=d.m||{};
  M.forEach(function(m){var t=m.cts||m.ts;var dt=diaTxt(t);if(dt!==dia){h+='<div class="ch-dia"><span>'+dt+'</span></div>';dia=dt;}var yo=m.de===YO;
    var q='';if(m.re&&byId[m.re]){var o=byId[m.re];q='<div class="ch-q" onclick="event.stopPropagation();chIr(\''+o.id+'\')"><b>'+(o.de===YO?'Vos':(o.de==='gon'?'Gon':'Euge'))+'</b><span>'+(o.del?'Mensaje borrado':o.foto&&!o.t?'📷 Foto':esc(String(o.t||'').slice(0,80)))+'</span></div>';}
    var r=m.r||{};var rs=Object.keys(r).filter(function(k){return r[k];}).map(function(k){return r[k];});
    var tick=yo?'<span class="ch-tk'+(otroSeen>=t?' v':'')+'">'+(otroSeen>=t?'✓✓':'✓')+'</span>':'';
    h+='<div class="ch-row '+(yo?'yo':'el')+'" id="chm-'+m.id+'"><div class="ch-b" onclick="chMenu(\''+m.id+'\',event)">'+q+(m.foto?'<img src="'+m.foto+'" onclick="event.stopPropagation();csVer(this.src)">':'')+(m.t?'<div class="ch-t">'+esc(m.t).replace(/\n/g,'<br>')+'</div>':'')+'<div class="ch-h">'+hhmm(t)+tick+'</div>'+(rs.length?'<div class="ch-rx">'+rs.join('')+(rs.length>1&&rs[0]===rs[1]?'<small>2</small>':'')+'</div>':'')+'</div></div>';});
  if(!M.length)h='<div class="ch-vacio">Acá pueden mandarse tickets, avisos y cosas de la casa 💬</div>';
  var reTxt='';if(chRe&&byId[chRe]){var o=byId[chRe];reTxt='<div class="ch-reply"><div><b>Respondiendo a '+(o.de===YO?'vos':(o.de==='gon'?'Gon':'Euge'))+'</b><span>'+(o.foto&&!o.t?'📷 Foto':esc(String(o.t||'').slice(0,90)))+'</span></div><button onclick="chRe=null;csRender()">✕</button></div>';}
  return '<div class="ch-bg" onclick="csTabIr(\'gastos\')"></div><div class="ch"><div class="ch-top"><button class="ch-back" onclick="csTabIr(\'gastos\')" aria-label="Volver">‹</button><div class="ch-av">'+(OTRO[0])+'</div><div style="flex:1;min-width:0"><div class="ch-nm">'+OTRO+'</div><small>'+(Math.abs(b)<1?'Están a mano':balTxt(b))+'</small></div><button class="cs-b g" onclick="csGastoAbrir()">+ Gasto</button><button class="cs-b p" onclick="csSaldarAbrir()">Saldar</button></div>'
   +'<div class="ch-list" id="ch-list" onclick="chCerrarMenu()">'+h+'</div>'
   +'<div class="ch-emo" id="ch-emo">'+EMO.map(function(e){return '<button onclick="chEmo(\''+e+'\')">'+e+'</button>';}).join('')+'</div>'

   +'<button class="ch-send" onclick="chEnviar()" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2z"/></svg></button></div></div>';}

 var mas=document.querySelector('#mas-modal .mas-item');if(mas&&!document.getElementById('mas-casa')){var b=document.createElement('button');b.className='mas-item';b.id='mas-casa';b.innerHTML='<span>🏡</span>Gastos casa';b.onclick=function(){masIr('casa');};mas.parentNode.insertBefore(b,mas);}}
