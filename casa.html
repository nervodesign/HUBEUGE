function cfxCard(d){var F=vivos(d.fx);var hoy=new Date(),mes=hoyISO().slice(0,7);

  if(!liSel){var hayDef=vivos(d.l).some(function(x){return !x.lid;});var cards=LL.map(function(l){return [l.id,l.titulo,l.fecha];});if(hayDef||!LL.length)cards.push(['default','Lista del súper','']);
    return '<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="cs-b az" onclick="llNueva()">+ Nueva lista</button></div>'
     +cards.map(function(c){var it=liItems(d,c[0]);var pend=it.filter(function(x){return !x.ok;}).length;return '<div class="cs-card ll-card" onclick="llAbrir(\''+c[0]+'\')"><span class="ico" style="background:#2F5E9E">'+svgI('check',20)+'</span><div style="flex:1;min-width:0"><div class="ll-t">'+esc(c[1])+'</div><small>'+(c[2]?fd(c[2])+' · ':'')+(it.length?pend+' por comprar'+(it.length-pend?' · '+(it.length-pend)+' listos':''):'Vacía')+'</small></div><span class="gc-chev"></span></div>';}).join('');}
  var L=liItems(d,liSel);var lst=liSel==='default'?{titulo:'Lista del súper',fecha:''}:d.ll[liSel];var hechos=L.filter(function(x){return x.ok;}).length;
  return '<div class="ll-head"><button class="cs-b g" onclick="llAbrir(null)">‹ Listas</button><div style="flex:1;min-width:0"><div class="ll-t" style="font-size:20px">'+esc(lst.titulo)+'</div>'+(lst.fecha?'<small>'+fd(lst.fecha)+'</small>':'')+'</div>'+(liSel!=='default'?'<button class="cs-b g" onclick="llEditar(\''+liSel+'\')">Editar</button>':'')+'</div>'
   +'<div class="cs-card"><div style="display:flex;gap:8px;margin-bottom:10px"><input class="cs-in" id="li-in" placeholder="Agregar algo (ej: Leche)" onkeydown="if(event.key===\'Enter\')liAdd()"><button class="cs-b az" onclick="liAdd()">Agregar</button></div>'
   +(L.length?L.map(function(x){return '<div class="li-it'+(x.ok?' ok':'')+'"><span class="li-ck" onclick="liOk(\''+x.id+'\')">'+(x.ok?'✓':'')+'</span><span style="flex:1" onclick="liOk(\''+x.id+'\')">'+esc(x.t)+'</span><small>'+(x.de==='gon'?'Gon':'Euge')+'</small><button class="li-ed" onclick="liEditar(\''+x.id+'\')" title="Editar">✎</button><button class="li-ed" onclick="liBorrar(\''+x.id+'\')" title="Borrar">✕</button></div>';}).join(''):'<small style="color:#8C7B6E">La lista está vacía. Lo que agrega uno lo ve el otro.</small>')
   +(hechos?'<div style="text-align:right;margin-top:8px"><button class="cs-b g" style="padding:6px 12px;font-size:12.5px" onclick="liLimpiar()">Borrar comprados ('+hechos+')</button></div>':'')+'</div>';}
window.llAbrir=function(id){liSel=id;csRender();window.scrollTo(0,0);};
window.llNueva=function(){sheet('<h3>Nueva lista<button onclick="csCerrar()">✕</button></h3><input class="cs-in" id="ll-t" placeholder="Título (ej: Súper del finde, Asado sábado)"><div><div class="cs-k" style="margin-bottom:6px">FECHA</div><input type="date" class="cs-in" id="ll-f" value="'+hoyISO()+'"></div><button class="cs-b p" style="padding:14px" onclick="llGuardar()">Crear lista</button>');setTimeout(function(){var i=document.getElementById('ll-t');if(i)i.focus();},100);};
window.llEditar=function(id){var d=csLoad();var l=d.ll[id];if(!l)return;sheet('<h3>Editar lista<button onclick="csCerrar()">✕</button></h3><input class="cs-in" id="ll-t" value="'+esc(l.titulo)+'"><div><div class="cs-k" style="margin-bottom:6px">FECHA</div><input type="date" class="cs-in" id="ll-f" value="'+(l.fecha||'')+'"></div><button class="cs-b p" style="padding:14px" onclick="llGuardar(\''+id+'\')">Guardar</button><button class="cs-b g" onclick="llBorrar(\''+id+'\')">Borrar lista</button>');};
window.llGuardar=function(id){var t=document.getElementById('ll-t').value.trim();if(!t){showToast('Poné un título');return;}var d=csLoad();var l=id?d.ll[id]:{id:uid(),cts:Date.now()};l.titulo=t;l.fecha=document.getElementById('ll-f').value;csPut('ll',l);csCerrar();liSel=l.id;csRender();};
window.llBorrar=function(id){if(!confirm('¿Borrar esta lista y todo lo que tiene?'))return;var d=csLoad();var now=Date.now();vivos(d.l).forEach(function(x){if(x.lid===id){x.del=true;x.ts=now;}});if(d.ll[id]){d.ll[id].del=true;d.ll[id].ts=now;}csStoreLocal(d);liSel=null;csCerrar();csAfter();};
window.liAdd=function(){var i=document.getElementById('li-in');var t=(i.value||'').trim();if(!t)return;csPut('l',{id:uid(),t:t,de:YO,ok:false,cts:Date.now(),lid:liSel==='default'?undefined:liSel});setTimeout(function(){var n=document.getElementById('li-in');if(n)n.focus();},30);};
window.liOk=function(id){var d=csLoad();var x=d.l[id];if(!x)return;x.ok=!x.ok;csPut('l',x);};
window.liEditar=function(id){var d=csLoad();var x=d.l[id];if(!x)return;sheet('<h3>Editar<button onclick="csCerrar()">✕</button></h3><input class="cs-in" id="li-e" value="'+esc(x.t)+'" onkeydown="if(event.key===\'Enter\')liEditOk(\''+id+'\')"><button class="cs-b p" style="padding:14px" onclick="liEditOk(\''+id+'\')">Guardar</button><button class="cs-b g" onclick="liBorrar(\''+id+'\');csCerrar()">Borrar</button>');};
window.liEditOk=function(id){var t=document.getElementById('li-e').value.trim();if(!t)return;var d=csLoad();var x=d.l[id];if(!x)return;x.t=t;csPut('l',x);csCerrar();};
window.liBorrar=function(id){csDel('l',id);};
window.liLimpiar=function(){var d=csLoad();vivos(d.l).forEach(function(x){if(x.ok&&(x.lid||'default')===liSel){x.del=true;x.ts=Date.now();d.l[x.id]=x;}});csStoreLocal(d);csAfter();};

window.chPend=null;
function hhmm(ts){var d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function diaTxt(ts){var d=new Date(ts),h=new Date();var a=new Date(h);a.setDate(h.getDate()-1);if(d.toDateString()===h.toDateString())return 'Hoy';if(d.toDateString()===a.toDateString())return 'Ayer';return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});}
function vChat(d){var M=vivos(d.m).sort(function(a,b){return (a.cts||a.ts)-(b.cts||b.ts);});var b=balance(d);var dia='',h='';
  M.forEach(function(m){var t=m.cts||m.ts;var dt=diaTxt(t);if(dt!==dia){h+='<div class="ch-dia"><span>'+dt+'</span></div>';dia=dt;}var yo=m.de===YO;
    h+='<div class="ch-row '+(yo?'yo':'el')+'"><div class="ch-b">'+(!yo?'<div class="ch-n">'+(m.de==='gon'?'Gon':'Euge')+'</div>':'')+(m.foto?'<img src="'+m.foto+'" onclick="csVer(this.src)">':'')+(m.t?'<div class="ch-t">'+esc(m.t).replace(/\n/g,'<br>')+'</div>':'')+'<div class="ch-h">'+hhmm(t)+'</div></div></div>';});
  if(!M.length)h='<div class="ch-vacio">Acá pueden mandarse tickets, avisos y cosas de la casa 💬</div>';
  return '<div class="ch"><div class="ch-top"><button class="ch-back" onclick="csTabIr(\'gastos\')" aria-label="Volver">‹</button><div><small>Balance</small><div>'+(Math.abs(b)<1?'Están a mano':balTxt(b))+'</div></div><button class="cs-b g" onclick="csGastoAbrir()">+ Gasto</button><button class="cs-b p" onclick="csSaldarAbrir()">Saldar</button></div>'
   +'<div class="ch-list" id="ch-list">'+h+'</div>'
   +'<div class="ch-prev" id="ch-prev"></div><div class="ch-bar"><label class="ch-clip" title="Mandar foto"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 11.5 12.6 19.9a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg><input type="file" accept="image/*" style="display:none" onchange="chFoto(this)"></label>'
   +'<textarea id="ch-in" rows="1" placeholder="Escribí un mensaje…" oninput="this.style.height=\'auto\';this.style.height=Math.min(this.scrollHeight,120)+\'px\'" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();chEnviar();}"></textarea>'
   +'<button class="ch-send" onclick="chEnviar()" aria-label="Enviar"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2z"/></svg></button></div></div>';}
window.chFoto=function(inp){var f=inp.files&&inp.files[0];if(!f)return;achicar(f,1000,function(u){chPend=u;var p=document.getElementById('ch-prev');p.innerHTML='<img src="'+u+'"><span>Foto lista para mandar</span><button onclick="chPend=null;this.parentNode.innerHTML=\'\';this.parentNode&&(this.parentNode.style.display=\'none\')">✕</button>';p.style.display='flex';});};
window.chEnviar=function(){var i=document.getElementById('ch-in');var t=(i&&i.value||'').trim();if(!t&&!chPend)return;csPut('m',{id:uid(),de:YO,t:t,foto:chPend||undefined,cts:Date.now()});chPend=null;setTimeout(function(){var n=document.getElementById('ch-in');if(n)n.focus();},50);};

 var mas=document.querySelector('#mas-modal .mas-item');if(mas&&!document.getElementById('mas-casa')){var b=document.createElement('button');b.className='mas-item';b.id='mas-casa';b.innerHTML='<span>🏡</span>Gastos casa';b.onclick=function(){masIr('casa');};mas.parentNode.insertBefore(b,mas);}}
navAdd();

  var isDark=document.body.classList.contains('theme-dark');document.body.className='s-casa'+(isDark?' theme-dark':'');
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('on');});var b=document.getElementById('btn-pdf-top');if(b)b.style.display='none';
  document.getElementById('view-casa').classList.add('on');csRender();try{buildMainNav();}catch(e){}window.scrollTo(0,0);csSync();};

})();
